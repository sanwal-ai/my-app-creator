name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Firestore App Document ID"
        required: true
        default: "1791224204585"
        type: string

      app_name:
        description: "Android App Name"
        required: true
        default: "My New App"
        type: string

      package_name:
        description: "Unique package name, e.g. com.sana.mynewapp"
        required: true
        default: "com.myappcreator.client"
        type: string

      version_name:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"
        type: string

      version_code:
        description: "Version code (positive integer)"
        required: true
        default: "1"
        type: string

      icon_url:
        description: "HTTPS URL of app launcher icon"
        required: false
        default: ""
        type: string

  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve and validate build values
        shell: bash
        env:
          INPUT_APP_ID: ${{ github.event.inputs.app_id }}
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package_name }}
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          APP_ID="${INPUT_APP_ID:-1791224204585}"
          APP_NAME="${INPUT_APP_NAME:-My New App}"
          APP_PACKAGE="${INPUT_PACKAGE:-com.myappcreator.client}"
          APP_VERSION="${INPUT_VERSION:-1.0.0}"
          APP_VERSION_CODE="${INPUT_VERSION_CODE:-1}"
          ICON_URL="${INPUT_ICON_URL:-}"

          [[ "$APP_ID" =~ ^[0-9]+$ ]] || {
            echo "Invalid App ID"
            exit 1
          }

          [[ "$APP_PACKAGE" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || {
            echo "Invalid package name"
            exit 1
          }

          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid version code"
            exit 1
          }

          if [ -n "$ICON_URL" ]; then
            [[ "$ICON_URL" =~ ^https:// ]] || {
              echo "Icon URL must use HTTPS"
              exit 1
            }
          fi

          SAFE_NAME="$(printf '%s' "$APP_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')"

          [ -n "$SAFE_NAME" ] || SAFE_NAME="MyApp"

          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "APP_PACKAGE=$APP_PACKAGE"
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_VERSION_CODE=$APP_VERSION_CODE"
            echo "ICON_URL=$ICON_URL"
            echo "SAFE_NAME=$SAFE_NAME"
          } >> "$GITHUB_ENV"

      - name: Generate app runtime configuration
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          test -n "$FIREBASE_API_KEY" || {
            echo "Missing FIREBASE_API_KEY repository secret"
            exit 1
          }

          mkdir -p app/src/main/java/com/myappcreator/client

          cat > app/src/main/java/com/myappcreator/client/AppBuildConfig.kt <<EOF
          package com.myappcreator.client

          object AppBuildConfig {
              const val APP_DOCUMENT_ID = "$APP_ID"
              const val FIREBASE_API_KEY = "$FIREBASE_API_KEY"
              const val FIREBASE_PROJECT_ID = "myappcreator-2bd13"
              const val FIREBASE_APPLICATION_ID = "1:98660702874:android:dynamic"
          }
          EOF

      # ---------------------------------------------------------
      # Launcher icon system
      # A default icon is ALWAYS created first.
      # This prevents @mipmap/ic_launcher missing build errors.
      # ---------------------------------------------------------

      - name: Install launcher icon tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create default launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          convert \
            -size 512x512 \
            xc:"#5b5ce2" \
            -gravity center \
            -fill white \
            -pointsize 220 \
            -font DejaVu-Sans-Bold \
            -annotate 0 "A" \
            /tmp/default-launcher.png

          convert /tmp/default-launcher.png \
            -resize 48x48 \
            PNG32:app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert /tmp/default-launcher.png \
            -resize 72x72 \
            PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert /tmp/default-launcher.png \
            -resize 96x96 \
            PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert /tmp/default-launcher.png \
            -resize 144x144 \
            PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert /tmp/default-launcher.png \
            -resize 192x192 \
            PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Default launcher icon created."

      - name: Download custom launcher icon
        if: env.ICON_URL != ''
        shell: bash
        run: |
          echo "Custom icon URL received."

          if curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            "$ICON_URL" \
            --output /tmp/custom-launcher-icon
          then
            echo "Custom launcher icon downloaded."

            if identify /tmp/custom-launcher-icon > /dev/null 2>&1; then

              if \
                convert /tmp/custom-launcher-icon \
                  -auto-orient \
                  -resize '48x48^' \
                  -gravity center \
                  -extent 48x48 \
                  PNG32:app/src/main/res/mipmap-mdpi/ic_launcher.png \
                && \
                convert /tmp/custom-launcher-icon \
                  -auto-orient \
                  -resize '72x72^' \
                  -gravity center \
                  -extent 72x72 \
                  PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png \
                && \
                convert /tmp/custom-launcher-icon \
                  -auto-orient \
                  -resize '96x96^' \
                  -gravity center \
                  -extent 96x96 \
                  PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher.png \
                && \
                convert /tmp/custom-launcher-icon \
                  -auto-orient \
                  -resize '144x144^' \
                  -gravity center \
                  -extent 144x144 \
                  PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
                && \
                convert /tmp/custom-launcher-icon \
                  -auto-orient \
                  -resize '192x192^' \
                  -gravity center \
                  -extent 192x192 \
                  PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              then
                echo "Custom launcher icon generated successfully."
              else
                echo "::warning::Custom icon conversion failed. Restoring default icon."

                convert /tmp/default-launcher.png -resize 48x48 \
                  PNG32:app/src/main/res/mipmap-mdpi/ic_launcher.png

                convert /tmp/default-launcher.png -resize 72x72 \
                  PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png

                convert /tmp/default-launcher.png -resize 96x96 \
                  PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher.png

                convert /tmp/default-launcher.png -resize 144x144 \
                  PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher.png

                convert /tmp/default-launcher.png -resize 192x192 \
                  PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              fi

            else
              echo "::warning::Downloaded URL is not a valid image. Default launcher icon will be used."
            fi

          else
            echo "::warning::Custom icon download failed. Default launcher icon will be used."
          fi

      - name: Verify launcher icons
        shell: bash
        run: |
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Launcher icons verified successfully."

      - name: Build APK
        run: |
          gradle assembleDebug \
            -PAPP_NAME="$APP_NAME" \
            -PAPP_PACKAGE="$APP_PACKAGE" \
            -PAPP_VERSION="$APP_VERSION" \
            -PAPP_VERSION_CODE="$APP_VERSION_CODE"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${SAFE_NAME}-${APP_VERSION}-${APP_ID}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-${{ env.APP_VERSION }}-${{ env.APP_ID }}
          path: android-app/app/build/outputs/apk/debug/${{ env.SAFE_NAME }}-${{ env.APP_VERSION }}-${{ env.APP_ID }}.apk
          if-no-files-found: error
